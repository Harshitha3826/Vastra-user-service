sonar.projectKey=user-service
sonar.projectName=user-service

# Source directories - only scan actual application code
sonar.sources=src
sonar.tests=src/__tests__

# Exclusions - never scan these
sonar.exclusions=\
  node_modules/**,\
  **/node_modules/**,\
  dist/**,\
  build/**,\
  coverage/**,\
  **/*.test.js,\
  **/*.spec.js,\
  **/*.min.js,\
  package-lock.json,\
  .env,\
  .env.*,\
  **/.env,\
  **/.env.*,\
  *.example

# Test file patterns
sonar.test.inclusions=src/__tests__/**/*.test.js

# Coverage report (generated by jest --coverage)
sonar.javascript.lcov.reportPaths=coverage/lcov.info

# Exclude infrastructure files from coverage (require real DB - not unit testable)
sonar.coverage.exclusions=src/server.js,src/db/**,src/models/**

# Encoding
sonar.sourceEncoding=UTF-8
